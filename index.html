<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario de Migrañas</title>
    <style>
        :root {
            --primary: #5c6bc0;
            --background: #f4f5f7;
            --card: #ffffff;
            --text: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
        }
        h1, h2 { text-align: center; color: var(--primary); }
        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input, select, textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        .entry {
            border-left: 4px solid var(--primary);
            padding-left: 10px;
            margin-bottom: 15px;
        }
        .entry-header { font-weight: bold; font-size: 0.9em; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h1>Control de Migrañas</h1>

    <!-- Formulario de registro -->
    <div class="card">
        <h2>Registrar Crisis</h2>
        <form id="migraineForm">
            <label for="date">Fecha y Hora:</label>
            <input type="datetime-local" id="date" required>

            <label for="intensity">Repercusión / Intensidad (0 al 3):</label>
            <input type="number" id="intensity" min="0" max="10" required>

            <label for="location">Localización / Tipo:</label>
            <select id="location">
                <option value="Opresivo">Opresivo</option>
                <option value="Pulsátil">Pulsátil</option>
                <option value="Unilateral (Un lado)">Unilateral (Un lado)</option>
                <option value="Bilateral (Ambos lados)">Bilateral (Ambos lados)</option>
                <option value="Frontal">Frontal</option>
                <option value="Generalizado">Generalizado</option>
            </select>

            <label for="symptoms">Síntomas (separados por coma):</label>
            <input type="text" id="symptoms" placeholder="Ej: Aura, Náuseas, Fotofobia">

            <label for="triggers">Posibles detonantes:</label>
            <input type="text" id="triggers" placeholder="Ej: Dolor de cuello, Estrés, Falta de sueño">

            <label for="medication">Medicación tomada:</label>
            <input type="text" id="medication" placeholder="Ej: Espidifen, Rizatriptán">

            <button type="submit">Guardar Registro</button>
        </form>
    </div>

    <!-- Historial de registros -->
    <div class="card">
        <h2>Historial Reciente</h2>
        <div id="historyLog"></div>
    </div>
</div>
