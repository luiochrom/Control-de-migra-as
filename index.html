<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario de Migrañas</title>
    <style>
        :root {
            --primary: #5c6bc0;
            --background: #f4f5f7;
            --card: #ffffff;
            --text: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
        }
        h1, h2 { text-align: center; color: var(--primary); }
        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        label { font-weight: bold; display: block; margin-top: 12px; }
        input, select, textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
            margin-top: 18px;
            cursor: pointer;
            border-radius: 8px;
        }
        button:hover { opacity: 0.9; }
        .btn-secondary {
            background-color: #455a64;
            margin-top: 5px;
        }
        .btn-danger {
            background-color: #e53935;
            padding: 4px 8px;
            font-size: 12px;
            margin-top: 5px;
            width: auto;
            float: right;
        }
        .actions-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .entry {
            border-left: 4px solid var(--primary);
            padding-left: 12px;
            margin-bottom: 15px;
            position: relative;
            clear: both;
        }
        .entry-header { font-weight: bold; font-size: 0.9em; color: #666; }
        .hidden { display: none; }

        /* Estilos específicos para impresión */
        @media print {
            body { background-color: white; padding: 0; }
            .no-print { display: none !important; }
            .card { box-shadow: none; padding: 0; }
            .container { max-width: 100%; }
            .entry { border-left: 2px solid #000; page-break-inside: avoid; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="no-print">Control de Migrañas</h1>

    <!-- Formulario de registro (se oculta al imprimir) -->
    <div class="card no-print">
        <h2>Registrar Crisis</h2>
        <form id="migraineForm">
            <label for="date">Fecha y Hora:</label>
            <input type="datetime-local" id="date" required>

            <label for="intensity">Intensidad del dolor:</label>
            <select id="intensity" required>
                <option value="0">0 - Sin dolor</option>
                <option value="1">1 - Leve</option>
                <option value="2">2 - Moderado</option>
                <option value="3">3 - Severo / Intenso</option>
            </select>

            <label for="location">Localización del dolor:</label>
            <select id="location">
                <option value="En la nuca">En la nuca</option>
                <option value="En ambas sienes">En ambas sienes</option>
                <option value="En los ojos">En los ojos</option>
                <option value="En la frente">En la frente</option>
                <option value="Unilateral (Un lado)">Unilateral (Un lado)</option>
                <option value="Bilateral (Ambos lados)">Bilateral (Ambos lados)</option>
                <option value="Generalizado">Generalizado</option>
            </select>

            <label for="preventive">¿Toma medicación preventiva actualmente?</label>
            <select id="preventive" onchange="togglePreventiveInput()">
                <option value="No">No</option>
                <option value="Sí">Sí</option>
            </select>

            <div id="preventiveNameGroup" class="hidden">
                <label for="preventiveName">Nombre de la medicación preventiva:</label>
                <input type="text" id="preventiveName" placeholder="Ej: Topiramato, Propranolol, Flunarizina...">
            </div>

            <label for="medication">Medicación tomada (rescate):</label>
            <select id="medication">
                <option value="Ninguna">Ninguna</option>
                <option value="Espidifen 600">Espidifen 600</option>
                <option value="Espidifen 600 + Rizatriptan">Espidifen 600 + Rizatriptan</option>
                <option value="Otra">Otra medicación</option>
            </select>

            <label for="symptoms">Síntomas (separados por coma):</label>
            <input type="text" id="symptoms" placeholder="Ej: Náuseas, Aura, Fotofobia, Mareo">

            <label for="triggers">Posibles detonantes:</label>
            <input type="text" id="triggers" placeholder="Ej: Estrés, Falta de sueño, Cambios de tiempo">

            <button type="submit">Guardar Registro</button>
        </form>
    </div>

    <!-- Historial de registros -->
    <div class="card">
        <h2>Historial de Migrañas</h2>
        
        <!-- Botones de exportación -->
        <div class="actions-group no-print">
            <button type="button" onclick="window.print()" class="btn-secondary">🖨️ Imprimir / Guardar PDF</button>
            <button type="button" onclick="exportToCSV()" class="btn-secondary">📊 Exportar a Excel (CSV)</button>
        </div>

        <div id="historyLog"></div>
    </div>
</div>

<script>
    // Fecha y hora actual por defecto
    document.getElementById('date').value = new Date().toISOString().slice(0, 16);

    function togglePreventiveInput() {
        const preventiveVal = document.getElementById('preventive').value;
        const group = document.getElementById('preventiveNameGroup');
        if (preventiveVal === 'Sí') {
            group.classList.remove('hidden');
        } else {
            group.classList.add('hidden');
            document.getElementById('preventiveName').value = '';
        }
    }

    const form = document.getElementById('migraineForm');
    const historyLog = document.getElementById('historyLog');

    function loadEntries() {
        const entries = JSON.parse(localStorage.getItem('migraineEntries')) || [];
        
        // Ordenar por fecha de más reciente a más antigua
        entries.sort((a, b) => new Date(b.date) - new Date(a.date));

        historyLog.innerHTML = entries.length === 0 ? '<p>No hay registros guardados.</p>' : '';
        
        entries.forEach((entry, index) => {
            const entryEl = document.createElement('div');
            entryEl.className = 'entry';
            entryEl.innerHTML = `
                <button class="btn-danger no-print" onclick="deleteEntry(${index})">Eliminar</button>
                <div class="entry-header">${new Date(entry.date).toLocaleString()}</div>
                <div><strong>Intensidad:</strong> ${entry.intensity} / 3</div>
                <div><strong>Localización:</strong> ${entry.location}</div>
                <div><strong>Preventivo:</strong> ${entry.preventive === 'Sí' ? entry.preventiveName || 'Sí (Sin especificar)' : 'No'}</div>
                <div><strong>Medicación rescate:</strong> ${entry.medication}</div>
                ${entry.symptoms ? `<div><strong>Síntomas:</strong> ${entry.symptoms}</div>` : ''}
                ${entry.triggers ? `<div><strong>Detonantes:</strong> ${entry.triggers}</div>` : ''}
            `;
            historyLog.appendChild(entryEl);
        });
    }

    function deleteEntry(index) {
        if (confirm('¿Seguro que deseas eliminar este registro?')) {
            const entries = JSON.parse(localStorage.getItem('migraineEntries')) || [];
            entries.sort((a, b) => new Date(b.date) - new Date(a.date));
            entries.splice(index, 1);
            localStorage.setItem('migraineEntries', JSON.stringify(entries));
            loadEntries();
        }
    }

    function exportToCSV() {
        const entries = JSON.parse(localStorage.getItem('migraineEntries')) || [];
        if (entries.length === 0) {
            alert('No hay registros para exportar.');
            return;
        }

        entries.sort((a, b) => new Date(b.date) - new Date(a.date));

        let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; // UTF-8 BOM para abrir bien en Excel
        csvContent += "Fecha y Hora;Intensidad (0-3);Localización;Preventivo;Nombre Preventivo;Medicación Rescate;Síntomas;Detonantes\n";

        entries.forEach(e => {
            const row = [
                `"${new Date(e.date).toLocaleString()}"`,
                `"${e.intensity}"`,
                `"${e.location || ''}"`,
                `"${e.preventive || 'No'}"`,
                `"${e.preventiveName || ''}"`,
                `"${e.medication || ''}"`,
                `"${e.symptoms || ''}"`,
                `"${e.triggers || ''}"`
            ].join(";");
            csvContent += row + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `historial_migranas_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const newEntry = {
            date: document.getElementById('date').value,
            intensity: document.getElementById('intensity').value,
            location: document.getElementById('location').value,
            preventive: document.getElementById('preventive').value,
            preventiveName: document.getElementById('preventiveName').value,
            medication: document.getElementById('medication').value,
            symptoms: document.getElementById('symptoms').value,
            triggers: document.getElementById('triggers').value
        };

        const entries = JSON.parse(localStorage.getItem('migraineEntries')) || [];
        entries.push(newEntry);
        localStorage.setItem('migraineEntries', JSON.stringify(entries));

        form.reset();
        document.getElementById('date').value = new Date().toISOString().slice(0, 16);
        togglePreventiveInput();
        loadEntries();
    });

    loadEntries();
</script>

</body>
</html>
